[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdlc-saas"
version = "0.1.0"
description = "Multi-tenant AI SDLC SaaS platform (MetaGPT BA/Architect, ChatDev QA/Review, DeepAgents/InstaBox coding, independent verification)"
readme = "docs/saas-product-roadmap.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    "alembic>=1.14,<2.0",
    "bcrypt>=4.1,<6.0",
    "cryptography>=44.0,<51.0",
    "fastapi>=0.115,<0.145",
    "httpx>=0.27,<1.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint>=3.0,<5.0",
    "openai>=1.50,<3.0",
    "prometheus-client>=0.21,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "PyJWT>=2.9,<3.0",
    "python-multipart>=0.0.12,<1.0",
    "PyYAML>=6.0,<7.0",
    "SQLAlchemy>=2.0.30,<3.0",
    "sse-starlette>=2.1,<4.0",
    "uvicorn>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "playwright>=1.48",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
ai-sdlc-api = "ai_sdlc_saas.api.app:run_cli"
ai-sdlc-worker = "ai_sdlc_saas.orchestrator.worker:run_cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_sdlc*", "ai_sdlc_saas*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["e2e: Playwright browser E2E tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/test_contracts.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]
